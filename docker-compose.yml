services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: contractguard-backend
    expose:
      - "8000"
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/storage/db/contracts.db
    volumes:
      - ./storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: contractguard-worker
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/storage/db/contracts.db
    volumes:
      - ./storage:/app/storage

  redis:
    image: redis:7
    container_name: contractguard-redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: contractguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
